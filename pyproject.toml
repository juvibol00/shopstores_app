[project]
name = "shopstores"
version = "0.1.0"
description = "ShopStore's — gestion de ventas movil"
requires-python = ">=3.10"

# Clavado a proposito, con lo aprendido en la Fase 0:
#
# - `flet` en 0.85.3, la misma de SELL-B, para conservar las trampas ya
#   documentadas en la seccion 10 del diseno.
# - **`pillow` tiene que ser 12.2.0.** Flet publica ruedas de Android solo de
#   algunas versiones y la 12.3.0 no esta; si pip resuelve a la mas nueva, el APK
#   no compila.
#
# - `fpdf2` arma el catalogo. Es `py3-none-any`, Python puro.
#
# - **`cryptography` tiene que ser 43.0.1.** Cifra la clave del correo con la
#   llave derivada del PIN, y es el unico paquete con codigo nativo ademas de
#   pillow, asi que depende del indice de Flet (https://pypi.flet.dev).
#   La 48.0.0 esta publicada **solo para Python 3.14 y solo tres arquitecturas**
#   —falta `x86`—, y por eso la primera compilacion murio en "Packaging Python
#   app". La 43.0.1 esta como `cp37-abi3`, que vale para cualquier Python de 3.7
#   en adelante, y con las cuatro arquitecturas. Comprobado en el indice, no
#   supuesto: https://pypi.flet.dev/cryptography/
#
# `sqlite3`, `hashlib` y `smtplib` son biblioteca estandar: la base, el PIN y el
# envio del correo no agregan dependencia.
dependencies = [
    "flet==0.85.3",
    "pillow==12.2.0",
    "fpdf2==2.8.8",
    "cryptography==43.0.1",
]

[tool.flet]
org = "com.bolivarsoftware"
product = "ShopStore's"
company = "Bolivar Software Company"

[tool.flet.app]
# El identificador no se puede cambiar despues sin desinstalar y perder los datos.
module = "main"

[tool.flet.android]
package = "com.bolivarsoftware.shopstore"

[tool.flet.android.permission]
"android.permission.INTERNET" = true
