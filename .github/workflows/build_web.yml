name: Build ShopStore Web

# Hermano del flujo del APK. Compila la MISMA aplicacion para navegador y la deja
# publicada en GitHub Pages, que es gratis y no pide servidor encendido.
#
# El de Android no se toca: son dos versiones del mismo codigo, no un reemplazo.
#
# **Primera vez:** en Settings -> Pages hay que poner "Source: GitHub Actions".
# Sin eso el ultimo paso falla aunque la compilacion haya salido bien.
#
# Esta primera version va deliberadamente pelada. Lo unico que queremos saber hoy
# es si la aplicacion **compila** para navegador: `cryptography` y `pillow` llevan
# codigo nativo y necesitan una version hecha para Pyodide. Los ajustes de la app
# instalable (icono, colores, pantalla completa) se agregan despues, cuando ya
# sepamos que hay algo que ajustar.

on:
  workflow_dispatch:

# Lo que pide la publicacion en Pages: leer el codigo y escribir el sitio.
permissions:
  contents: read
  pages: write
  id-token: write

# Si se lanzan dos seguidos, que no se pisen entre si.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - name: Leer el codigo del repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar el motor de Flet
        run: pip install flet==0.85.3

      # Lo mismo que en el APK: `flet build` empaqueta la carpeta tal cual.
      - name: Quitar del paquete lo que no va publicado
        run: |
          rm -rf .git .github datos pruebas
          find . -name "__pycache__" -type d -prune -exec rm -rf {} +
          echo "--- lo que se va a empaquetar ---"
          ls -a

      # **Las dependencias del navegador no son las de Android.** Tres ajustes,
      # todos **solo en la copia de este trabajo**: el repositorio no se toca y el
      # APK sigue saliendo con sus versiones exactas.
      #
      # 1. **Fuera `cryptography`.** Solo sirve para cifrar la clave de Gmail, y en
      #    el navegador su parte compilada en Rust no carga ("Could not load
      #    dynamic lib"). Desde el navegador tampoco se puede mandar correo, asi que
      #    no se pierde nada: `backend/seguridad.py` detecta que falta, deja entrar
      #    con el PIN igual, y el correo se declara no disponible.
      #
      # 2. **Sin numero a `pillow` y `fpdf2`.** Los pines de `pyproject.toml` estan
      #    calculados para Android, donde faltaban arquitecturas; el indice del
      #    navegador publica otras (pillow 10.2.0 contra 12.2.0). `flet` si queda
      #    clavado: el motor que compila y el que se empaqueta tienen que ser el
      #    mismo, y ya nos costo un APK averiguarlo.
      #
      # 3. **Tres piezas de la biblioteca estandar que en el navegador van aparte.**
      #    Pyodide las saca para que la descarga pese menos, y hay que pedirlas:
      #
      #      sqlite3   la base de datos. Sin el, muere en la primera linea que la toca.
      #      ssl       lo necesita `fpdf2` de rebote: `urllib.request` solo define
      #                `HTTPSHandler` si `ssl` carga, y `fpdf2` lo importa al arrancar.
      #      hashlib   la huella del PIN (`pbkdf2_hmac`). Desde Python 3.12 no tiene
      #                version de repuesto: sin este paquete, crear el PIN revienta.
      #
      #    La lista sale del indice del propio Pyodide que usa Flet 0.85.3 (0.27.7),
      #    donde estan marcados como `cpython_module`. Se cruzo contra lo que importa
      #    la aplicacion, para no descubrirlos de a uno en cada compilacion.
      #
      #    Van solo en `requirements.txt`: la compilacion corre con Python normal,
      #    donde vienen incluidos y no son paquetes instalables.
      #
      # **Hay que tocar los DOS archivos.** `pyproject.toml` manda al compilar,
      # pero el que viaja dentro del paquete y se lee **al arrancar en el
      # navegador** es `requirements.txt`. Tocar solo el primero deja una web que
      # compila y luego muere al abrirse.
      - name: Ajustar las dependencias al navegador
        run: |
          sed -i '/"cryptography/d' pyproject.toml
          sed -i '/^cryptography/d' requirements.txt
          sed -i -E 's/"(pillow|fpdf2)==[0-9.]+"/"\1"/' pyproject.toml
          sed -i -E 's/^(pillow|fpdf2)==[0-9.]+$/\1/' requirements.txt
          printf 'sqlite3\nssl\nhashlib\n' >> requirements.txt
          echo "--- dependencias con las que se compila la web ---"
          sed -n '/^dependencies/,/^]/p' pyproject.toml
          echo "--- y las que leera el navegador al arrancar ---"
          cat requirements.txt

      # `--base-url` es obligatorio: en GitHub Pages el sitio NO vive en la raiz
      # del dominio sino en /<repositorio>/. Sin esto la pagina carga en blanco,
      # porque busca sus propios archivos en una ruta que no existe.
      - name: Construir la version web
        run: yes | flet build web --verbose --base-url shopstores_app

      - name: Ver que salio
        run: |
          echo "--- contenido de build/web ---"
          ls -la build/web
          du -sh build/web

      - name: Preparar la publicacion
        uses: actions/configure-pages@v5

      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Publicar en GitHub Pages
        id: publicar
        uses: actions/deploy-pages@v4
